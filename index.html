<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="todo-app">
    <h1>待办事项</h1>

    <!-- 输入区域：输入任务后点击按钮或按回车添加 -->
    <div class="todo-form">
      <input id="todo-input" type="text" placeholder="输入一个任务">
      <button id="add-button" type="button">添加</button>
    </div>

    <!-- 任务列表会由 JavaScript 动态添加到这里 -->
    <ul id="todo-list" class="todo-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
